    <!-- Structured Data: Organization -->
    <script type="application/ld+json">

        "@type": "ContactPoint",

      }

    <!-- Structured Data: WebSite with SearchAction -->
    <script type="application/ld+json">

      "@context": "https://schema.org",

      "name": "SendSmiles",
      "url": "https://sendsmiles.in",

    <!-- Structured Data: Online Store -->
